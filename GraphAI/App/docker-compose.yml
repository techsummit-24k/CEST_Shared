services:
  neo4j:
    image: neo4j:5.26-community
    container_name: clinicalkg-neo4j
    restart: unless-stopped

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-clinicalkg2026}

      # Install Graph Data Science on container initialization.
      NEO4J_PLUGINS: '["graph-data-science"]'

      # Required to allow GDS procedures.
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*"

      # Suitable baseline for a 8–16 GB laptop.
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G

      # settings.
      NEO4J_dbms_security_auth__minimum__password__length: 8
      NEO4J_server_directories_import: /var/lib/neo4j/import

    volumes:
      - ./data/curated:/var/lib/neo4j/import
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins: